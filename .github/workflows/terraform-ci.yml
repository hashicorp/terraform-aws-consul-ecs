name: terraform-ci
on:
  push:
    branches:
      - 'main'
      - 'release/**'
  pull_request:
    branches:
      - 'main'
      - 'release/**'

permissions: {}
jobs:
  action-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Lint workflow
        uses: docker://docker.mirror.hashicorp.services/rhysd/actionlint:latest
        with:
          # we need to ignore the SC2086 rule to pass unescaped $VARS to the terraform commands
          args: -ignore SC2086
  get-go-version:
    uses: ./.github/workflows/reusable-get-go-version.yml
  go-fmt-and-lint-acceptance:
    needs:
    - get-go-version
    uses: ./.github/workflows/reusable-go-fmt-and-lint.yml
    with:
      go-version: ${{ needs.get-go-version.outputs.go-version }}
  terraform-fmt:
    needs:
    - action-lint
    uses: ./.github/workflows/reusable-terraform-fmt.yml
  acceptance-fargate:
    needs:
      - get-go-version
      - terraform-fmt
      - go-fmt-and-lint-acceptance
    strategy:
      matrix:
        include:
          - consul-version: "1.21.5"
            consul-enterprise-version: "1.21.12"
          - consul-version: "2.1.0"
            consul-enterprise-version: "2.1.0"
      fail-fast: false
    uses: ./.github/workflows/reusable-ecs-acceptance.yml
    with:
      go-version: ${{ needs.get-go-version.outputs.go-version }}
      name: acceptance-${{ matrix.consul-version }}-FARGATE
      launch-type: FARGATE
      consul-version: ${{ matrix.consul-version }}
      consul-enterprise-version: ${{ matrix.consul-enterprise-version }}
      # HCP acceptance is intentionally disabled as it is deprecated.
      enable-hcp: false
    secrets: inherit
  acceptance-ec2:
    needs:
      - get-go-version
      - acceptance-fargate
    strategy:
      matrix:
        include:
          - consul-version: "1.21.5"
            consul-enterprise-version: "1.21.12"
          - consul-version: "2.1.0"
            consul-enterprise-version: "2.1.0"
      fail-fast: false
    uses: ./.github/workflows/reusable-ecs-acceptance.yml
    with:
      go-version: ${{ needs.get-go-version.outputs.go-version }}
      name: acceptance-${{ matrix.consul-version }}-EC2
      launch-type: EC2
      consul-version: ${{ matrix.consul-version }}
      consul-enterprise-version: ${{ matrix.consul-enterprise-version }}
      # HCP acceptance is intentionally disabled as it is deprecated.
      enable-hcp: false
    secrets: inherit